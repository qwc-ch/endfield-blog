name: Lighthouse CI

# 每次 push 到 main、每次 PR、或者手动跑一次，都对本地的静态构建跑一轮 Lighthouse，
# 看首页 / 文章列表 / 一篇正文的性能、无障碍、最佳实践和 SEO 有没有跌破预算。
# @lhci/cli 只在 runner 上用 action 装，本地不装任何依赖。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      # 静态导出是纯文件，预览服务器由 LHCI 的 startServerCommand 自动拉起。
      # 三张页面按 lighthouserc.json 里的 budget 断言，任一低于阈值就失败。
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      # 把 HTML 报告存成 artifact，方便点开看明细
      - name: Upload Lighthouse report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci